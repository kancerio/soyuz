  "components": {
    "schemas": {
      "AIResponse": {
        "properties": {
          "result": {
            "type": "string",
            "title": "Result"
          },
          "original_text": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Original Text"
          },
          "translated_text": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Translated Text"
          },
          "source_lang": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Source Lang"
          },
          "target_lang": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Target Lang"
          },
          "action": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Action"
          }
        },
        "type": "object",
        "required": [
          "result"
        ],
        "title": "AIResponse",
        "description": "Common response shape for text AI endpoints."
      },
      "AssistRequest": {
        "properties": {
          "prompt": {
            "type": "string",
            "title": "Prompt"
          },
          "context": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Context"
          },
          "action": {
            "type": "string",
            "enum": [
              "shorten",
              "formal",
              "friendly"
            ],
            "title": "Action"
          }
        },
        "type": "object",
        "required": [
          "prompt",
          "action"
        ],
        "title": "AssistRequest"
      },
      "Body_document_analysis_document_analysis_post": {
        "properties": {
          "file": {
            "type": "string",
            "contentMediaType": "application/octet-stream",
            "title": "File"
          },
          "extract_fields": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ],
            "title": "Extract Fields"
          }
        },
        "type": "object",
        "required": [
          "file"
        ],
        "title": "Body_document_analysis_document_analysis_post"
      },
      "Body_speech_to_text_stt_post": {
        "properties": {
          "audio": {
            "type": "string",
            "contentMediaType": "application/octet-stream",
            "title": "Audio"
          },
          "language": {
            "type": "string",
            "title": "Language",
            "default": "ru"
          }
        },
        "type": "object",
        "required": [
          "audio"
        ],
        "title": "Body_speech_to_text_stt_post"
      },
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "SecretaryRequest": {
        "properties": {
          "action": {
            "type": "string",
            "title": "Action"
          },
          "details": {
            "type": "string",
            "title": "Details"
          }
        },
        "type": "object",
        "required": [
          "action",
          "details"
        ],
        "title": "SecretaryRequest"
      },
      "SecretaryResponse": {
        "properties": {
          "message": {
            "type": "string",
            "title": "Message"
          },
          "data": {
            "anyOf": [
              {
                "additionalProperties": true,
                "type": "object"
              },
              {
                "type": "null"
              }
            ],
            "title": "Data"
          }
        },
        "type": "object",
        "required": [
          "message"
        ],
        "title": "SecretaryResponse"
      },
      "TranslateRequest": {
        "properties": {
          "text": {
            "type": "string",
            "title": "Text"
          },
          "source_lang": {
            "type": "string",
            "title": "Source Lang"
          },
          "target_lang": {
            "type": "string",
            "title": "Target Lang"
          }
        },
        "type": "object",
        "required": [
          "text",
          "source_lang",
          "target_lang"
        ],
        "title": "TranslateRequest"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      }
    }
  }
}
