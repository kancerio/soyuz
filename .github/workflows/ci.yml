---
name: AI Service CI

# Запуск при пуше в любую ветку и при открытии/обновлении
# Pull Request в ветку main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest
      - name: Lint with flake8
        run: |
          flake8 ./src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ./src --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics
      - name: Check formatting with Black
        run: black ./src --check --diff
      - name: Run tests with pytest
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          pytest ./tests -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ai
          load: true
          tags: messenger-ai:ci-test
          push: false
      - name: Test Docker image
        run: |
          docker run -d --name ai-test -p 8000:8000 messenger-ai:ci-test
          sleep 10
          curl --fail http://localhost:8000/ || exit 1
          docker stop ai-test

  backend-postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: soyuz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d soyuz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run PostgreSQL integration tests
        working-directory: ./backend
        env:
          DB_INTEGRATION_TESTS: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: messenger
          DB_PASSWORD: secretpassword
          DB_DATABASE: soyuz_test
        run: npm test -- --runInBand postgres.integration.spec.ts
