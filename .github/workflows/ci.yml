---
name: AI Service CI

# Запуск при пуше в любую ветку и при открытии/обновлении
# Pull Request в ветку main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest
      - name: Lint with flake8
        run: |
          flake8 ./src --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ./src --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics
      - name: Check formatting with Black
        run: black ./src --check --diff
      - name: Run tests with pytest
        run: |
          export PYTHONPATH=./src:$PYTHONPATH
          pytest ./tests -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.ai
          load: true
          tags: messenger-ai:ci-test
          push: false
      - name: Test Docker image
        run: |
          docker run -d --name ai-test -p 8000:8000 messenger-ai:ci-test
          sleep 10
          curl --fail http://localhost:8000/ || exit 1
          docker stop ai-test
