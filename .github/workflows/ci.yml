name: Soyuz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend install and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend install, build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand --coverage
        working-directory: backend
        env:
          NODE_OPTIONS: --experimental-vm-modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  ai-tests:
    name: AI service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r ai-service/requirements.txt
      - run: python -m pytest ai-service/tests -v --tb=short

  postgres-integration:
    name: Backend PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: messenger
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: soyuz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger -d soyuz_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test -- --runInBand postgres.integration.spec.ts
        working-directory: backend
        env:
          DB_INTEGRATION_TESTS: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: messenger
          DB_PASSWORD: secretpassword
          DB_DATABASE: soyuz_test
          NODE_OPTIONS: --experimental-vm-modules

  docker-image:
    name: AI service Docker image
    runs-on: ubuntu-latest
    needs: [frontend, backend, ai-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ai
          load: true
          tags: soyuz-ai:ci
          push: false
      - name: Smoke test mock-mode container
        run: |
          docker run -d --rm --name soyuz-ai-ci -p 8000:8000 -e AI_MOCK_MODE=true -e STT_PROVIDER=mock soyuz-ai:ci
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/; then
              docker stop soyuz-ai-ci
              exit 0
            fi
            sleep 2
          done
          docker logs soyuz-ai-ci
          docker stop soyuz-ai-ci
          exit 1
