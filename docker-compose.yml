services:
  postgres:
    image: postgres:15-alpine
    container_name: messenger-postgres
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: messenger_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - messenger-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: messenger-redis
    ports:
      - "6379:6379"
    networks:
      - messenger-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    container_name: messenger-ai
    ports:
      - "8000:8000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-http://host.docker.internal:1234/v1}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-lm-studio}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
      STT_PROVIDER: ${STT_PROVIDER:-mock}
      STT_BASE_URL: ${STT_BASE_URL:-http://host.docker.internal:9000/v1}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_TIMEOUT_SECONDS: ${STT_TIMEOUT_SECONDS:-120}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-26214400}
      MAX_SUMMARY_MESSAGES: ${MAX_SUMMARY_MESSAGES:-100}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - messenger-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

networks:
  messenger-network:
    driver: bridge

volumes:
  postgres_data:
